<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>秋招求职追踪器</title>
<style>
:root{--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--paper:#fff;--bg:#f5f7fb;--brand:#4f46e5;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1440px;margin:auto;padding:28px 22px 56px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.hero h1{margin:0;font-size:28px;letter-spacing:-.6px}.hero p{margin:5px 0 0;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px #0f172a08}.toolbar{padding:16px;display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;margin-bottom:14px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;color:var(--ink);background:#fff}textarea{min-height:78px;resize:vertical}button,.file-label{border:0;border-radius:8px;padding:10px 13px;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap;font-weight:600}button:hover,.file-label:hover{filter:brightness(.94)}button.ghost,.file-label.ghost{background:#eef2ff;color:#3730a3}button.danger{background:#fef2f2;color:#b91c1c}.table-card{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);background:#f8fafc;position:sticky;top:0;cursor:pointer;white-space:nowrap}tbody tr:hover{background:#fafaff}.company{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:2px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;white-space:nowrap}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:50px!important}dialog{border:0;border-radius:16px;box-shadow:0 24px 60px #0f172a40;padding:0;width:min(760px,calc(100% - 30px);max-height:92vh}dialog::backdrop{background:#0f172a65}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:19px}.icon-close{background:transparent;color:var(--muted);font-size:22px;padding:0}.form{padding:20px 22px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 5px}.wide{grid-column:1/-1}.form-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.hint{font-size:12px;color:var(--muted);margin-top:4px}.file-label input{display:none}.footer{color:var(--muted);font-size:12px;margin:13px 2px}.right-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:750px){.wrap{padding:18px 12px}.hero{align-items:start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.toolbar button{grid-column:1/-1}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
.ai-panel{margin:18px 22px 0;padding:12px;border:1px dashed #a5b4fc;border-radius:10px;background:#f8faff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ai-panel strong{display:block}.ai-panel span:not(.ai-message){font-size:12px;color:var(--muted)}.ai-panel .file-label,.ai-panel button{padding:7px 10px;font-size:12px}.ai-message{font-size:12px;color:var(--muted);flex:1;min-width:120px}.ai-message.error{color:#b91c1c}.ai-message.ok{color:#047857}@media(max-width:750px){.ai-panel{margin:14px 16px 0}}
</style>
</head>
<body><main class="wrap">
 <section class="hero"><div><h1>秋招求职追踪器</h1><p>把每一家公司的进度、薪资和福利放在一个清爽的本地清单里。</p></div><div class="right-actions"><button class="ghost" id="exportBtn">导出 CSV 备份</button><label class="file-label ghost">导入 CSV<input id="importFile" type="file" accept=".csv,text/csv"></label><button id="addBtn">＋ 添加公司</button></div></section>
 <section class="toolbar card"><input id="search" placeholder="搜索公司、地点、备注…"><select id="statusFilter"><option value="">全部状态</option></select><select id="locationFilter"><option value="">全部地点</option></select><select id="natureFilter"><option value="">全部性质</option></select><button class="ghost" id="clearFilters">清除筛选</button></section>
 <section class="table-card card"><table><thead><tr><th data-key="name">公司 ↕</th><th data-key="status">状态 ↕</th><th data-key="salary">薪资 ↕</th><th>岗位 / 试用期</th><th data-key="location">工作地点 ↕</th><th>工作时间</th><th>公司性质</th><th>五险一金 / 公积金</th><th data-key="updatedAt">最后更新 ↕</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
 <p class="footer"><span id="count">0</span> 条记录。数据只存储在此浏览器的本地空间；请定期导出 CSV 保存到安全位置。</p>
</main>
<dialog id="recordDialog"><form id="recordForm" method="dialog"><div class="modal-head"><h2 id="dialogTitle">添加公司</h2><button class="icon-close" type="button" id="closeDialog">×</button></div><div class="ai-panel"><div><strong>从招聘截图填表</strong><span>上传截图后，AI 会生成可修改的填写建议。</span></div><label class="file-label ghost">选择图片<input id="aiImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="ghost" id="aiExtractBtn" type="button" disabled>AI 识别</button><span id="aiMessage" class="ai-message"></span></div><div class="form">
 <div class="field"><label>公司名称 *</label><input name="name" required maxlength="80" placeholder="例如：某某科技"></div><div class="field"><label>招聘状态 *</label><select name="status" required></select></div>
 <div class="field"><label>转正后薪资</label><input name="salary" maxlength="100" placeholder="例如：20k × 14薪 / 年包 35w"></div><div class="field"><label>试用期工资</label><input name="probationSalary" maxlength="100" placeholder="例如：转正薪资的 80% / 16k"></div>
 <div class="field"><label>试用期长短</label><input name="probationLength" maxlength="60" placeholder="例如：3 个月 / 6 个月"></div><div class="field"><label>工作地点</label><input name="location" maxlength="80" placeholder="例如：上海 / 深圳"></div>
 <div class="field"><label>工作时间</label><input name="workingHours" maxlength="100" placeholder="例如：10:00–19:00，双休"></div><div class="field"><label>公司性质</label><input name="nature" maxlength="80" placeholder="例如：民企 / 国企 / 外企"></div>
 <div class="field"><label>五险一金详情</label><input name="insuranceFund" maxlength="160" placeholder="例如：五险一金，补充医疗"></div><div class="field"><label>公积金比例 / 基数</label><input name="housingFund" maxlength="120" placeholder="例如：12%，全额基数"></div>
 <div class="field"><label>最后更新日期</label><input name="updatedAt" type="date"></div><div class="field"><label>记录创建日期</label><input name="createdAt" type="date" readonly></div>
 <div class="field wide"><label>岗位内容</label><textarea name="jobContent" maxlength="2000" placeholder="岗位名称、主要工作内容、技能要求等"></textarea></div>
 <div class="field wide"><label>备注</label><textarea name="notes" maxlength="2000" placeholder="面试轮次、联系人、待办事项等"></textarea><div class="hint">可随时编辑，保存后会更新“最后更新日期”。</div></div>
 <div class="form-foot"><button class="ghost" type="button" id="cancelBtn">取消</button><button type="submit">保存记录</button></div>
</div></form></dialog>
<script>
const KEY='autumn-job-tracker-v1'; const statuses=['未投递','已投递','笔试','面试','口头Offer','正式Offer','无回音','已拒绝','已放弃'];
let records=[], editingId=null, sort={key:'updatedAt',dir:'desc'}; const $=s=>document.querySelector(s); const today=()=>new Date().toISOString().slice(0,10);
function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function load(){try{records=JSON.parse(localStorage.getItem(KEY))||[]}catch{records=[]} render()}
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function fillFilters(){const choose=(id,vals,label)=>{const el=$(id),old=el.value;el.innerHTML='<option value="">全部'+label+'</option>'+[...vals].sort().map(v=>`<option>${escapeHTML(v)}</option>`).join('');el.value=old}; choose('#statusFilter',statuses,'状态');choose('#locationFilter',new Set(records.map(r=>r.location).filter(Boolean)),'地点');choose('#natureFilter',new Set(records.map(r=>r.nature).filter(Boolean)),'性质')}
function render(){fillFilters();const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value,lf=$('#locationFilter').value,nf=$('#natureFilter').value;let list=records.filter(r=>(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!sf||r.status===sf)&&(!lf||r.location===lf)&&(!nf||r.nature===nf));list.sort((a,b)=>String(a[sort.key]||'').localeCompare(String(b[sort.key]||''),'zh-CN',{numeric:true})*(sort.dir==='asc'?1:-1));$('#count').textContent=list.length;$('#rows').innerHTML=list.length?list.map(r=>`<tr><td><div class="company">${escapeHTML(r.name)}</div>${r.jobContent?`<div class="sub">${escapeHTML(r.jobContent.slice(0,38))}${r.jobContent.length>38?'…':''}</div>`:''}</td><td><span class="tag">${escapeHTML(r.status)}</span></td><td>${escapeHTML(r.salary||'—')}${r.probationSalary?`<div class="sub">试用：${escapeHTML(r.probationSalary)}</div>`:''}</td><td>${escapeHTML(r.probationLength||'—')}</td><td>${escapeHTML(r.location||'—')}</td><td>${escapeHTML(r.workingHours||'—')}</td><td>${escapeHTML(r.nature||'—')}</td><td>${escapeHTML(r.insuranceFund||'—')} ${r.housingFund?`<div class="sub">公积金：${escapeHTML(r.housingFund)}</div>`:''}</td><td>${escapeHTML(r.updatedAt||'—')}</td><td><div class="actions"><button class="ghost" onclick="editRecord('${r.id}')">编辑</button><button class="danger" onclick="deleteRecord('${r.id}')">删除</button></div></td></tr>`).join(''):'<tr><td class="empty" colspan="10">还没有符合条件的记录。点击“添加公司”开始整理吧。</td></tr>'}
function populateStatus(select){select.innerHTML=statuses.map(s=>`<option>${s}</option>`).join('')}
function openForm(record){editingId=record?.id||null;const f=$('#recordForm');f.reset();populateStatus(f.status);$('#dialogTitle').textContent=record?'编辑公司':'添加公司';const data=record||{status:'未投递',updatedAt:today(),createdAt:today()};for(const [k,v] of Object.entries(data)){if(f.elements[k])f.elements[k].value=v||''}$('#recordDialog').showModal()}
window.editRecord=id=>openForm(records.find(r=>r.id===id));window.deleteRecord=id=>{const r=records.find(x=>x.id===id);if(r&&confirm(`确定删除“${r.name}”吗？此操作无法撤销。`)){records=records.filter(x=>x.id!==id);save()}};
$('#addBtn').onclick=()=>openForm();$('#closeDialog').onclick=$('#cancelBtn').onclick=()=>$('#recordDialog').close();
$('#recordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),data=Object.fromEntries(f.entries());data.id=editingId||crypto.randomUUID();data.createdAt=editingId?records.find(r=>r.id===editingId).createdAt:(data.createdAt||today());data.updatedAt=today();if(editingId)records=records.map(r=>r.id===editingId?data:r);else records.unshift(data);$('#recordDialog').close();save()};
['#search','#statusFilter','#locationFilter','#natureFilter'].forEach(id=>$(id).addEventListener(id==='#search'?'input':'change',render));$('#clearFilters').onclick=()=>{$('#search').value='';$('#statusFilter').value='';$('#locationFilter').value='';$('#natureFilter').value='';render()};
document.querySelectorAll('th[data-key]').forEach(th=>th.onclick=()=>{const key=th.dataset.key;sort={key,dir:sort.key===key&&sort.dir==='asc'?'desc':'asc'};render()});
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){const cols=['name','status','salary','probationSalary','probationLength','location','workingHours','nature','insuranceFund','housingFund','jobContent','notes','updatedAt','createdAt'],headers=['公司名称','招聘状态','转正后薪资','试用期工资','试用期长短','工作地点','工作时间','公司性质','五险一金详情','公积金比例/基数','岗位内容','备注','最后更新日期','记录创建日期'];const csv=[headers,...records.map(r=>cols.map(k=>r[k]))].map(row=>row.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`秋招求职追踪器备份_${today()}.csv`;a.click();URL.revokeObjectURL(a.href)}$('#exportBtn').onclick=exportCSV;
function parseCSV(t){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));const map={'公司名称':'name','招聘状态':'status','薪资':'salary','转正后薪资':'salary','试用期工资':'probationSalary','试用期长短':'probationLength','工作地点':'location','工作时间':'workingHours','公司性质':'nature','五险一金详情':'insuranceFund','公积金比例/基数':'housingFund','岗位内容':'jobContent','备注':'notes','最后更新日期':'updatedAt','记录创建日期':'createdAt'};const keys=rows.shift().map(h=>map[h.trim()]);if(!keys.includes('name'))return alert('无法识别文件。请导入本工具导出的 CSV 文件。');const incoming=rows.map(row=>Object.fromEntries(keys.map((k,i)=>[k,row[i]||'']))).filter(r=>r.name).map(r=>({...r,id:crypto.randomUUID(),status:statuses.includes(r.status)?r.status:'未投递',updatedAt:r.updatedAt||today(),createdAt:r.createdAt||today()}));if(!incoming.length)return alert('文件中没有可导入的公司记录。');if(confirm(`将新增导入 ${incoming.length} 条记录（不会覆盖现有记录），继续吗？`)){records=[...incoming,...records];save();alert('导入完成。')}e.target.value=''};
let aiImageData='';function setAIMessage(msg,type=''){const el=$('#aiMessage');el.textContent=msg;el.className='ai-message '+type}function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('图片读取失败'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('图片无法打开'));img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.86))};img.src=reader.result};reader.readAsDataURL(file)})}$('#aiImage').onchange=async e=>{const file=e.target.files[0];$('#aiExtractBtn').disabled=true;aiImageData='';if(!file)return;try{setAIMessage('正在准备图片…');aiImageData=await resizeImage(file);$('#aiExtractBtn').disabled=false;setAIMessage(`已选择：${file.name}`,'ok')}catch(err){setAIMessage(err.message,'error')}};
$('#aiExtractBtn').onclick=async()=>{if(!aiImageData)return;const btn=$('#aiExtractBtn');btn.disabled=true;setAIMessage('AI 正在识别，请稍候…');try{const res=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:aiImageData})});const data=await res.json();if(!res.ok)throw new Error(data.error||'识别失败');const f=$('#recordForm'),allowed=['name','status','salary','probationSalary','probationLength','location','workingHours','nature','insuranceFund','housingFund','jobContent','notes'],statusMap={not_applied:'未投递',applied:'已投递',written_test:'笔试',interview:'面试',verbal_offer:'口头Offer',formal_offer:'正式Offer',no_response:'无回音',rejected:'已拒绝',withdrawn:'已放弃'};for(const key of allowed){if(data.fields?.[key]&&f.elements[key])f.elements[key].value=key==='status'?(statusMap[data.fields[key]]||data.fields[key]):data.fields[key]}setAIMessage('已填入建议，请核对后保存。','ok')}catch(err){setAIMessage(err.message||'识别失败','error')}finally{btn.disabled=false}};
load();
</script></body></html>
