<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南网电工类机考</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:15px/1.7 Arial,"Microsoft YaHei",sans-serif}header{background:#111827;color:#fff;padding:16px 24px}main{max-width:1180px;margin:18px auto;padding:0 14px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}select,button{font:inherit;padding:9px 12px;border:1px solid #dbe3ef;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.panel,.card{background:#fff;border:1px solid #dbe3ef;border-radius:15px;padding:16px}.panel{height:max-content;position:sticky;top:12px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.grid button{padding:5px;font-size:12px}.grid .active{border-color:#2563eb;font-weight:bold}.grid .done{background:#dbeafe;color:#1d4ed8}.meta{display:flex;justify-content:space-between;color:#2563eb;font-weight:bold;border-bottom:1px solid #dbe3ef;padding-bottom:8px}.notice{margin:12px 0;padding:9px 12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px}.stem{white-space:pre-wrap;font-size:17px;margin:16px 0}.choices{display:grid;gap:8px;margin-top:16px}.choices button{text-align:left}.choices .sel{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}.letter{font-weight:bold;display:inline-block;width:28px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.source img{max-width:100%;display:block;margin:10px 0}@media(max-width:760px){.layout{display:block}.panel{position:static;margin-top:16px}}</style><body><header><h2>南网电工类 · 逐题机考</h2><div>单选题选后自动跳题；多选题可多选，点击“下一题”提交。</div></header><main><div class="bar"><label>试卷：<select id="exam"></select></label><button id="reset" class="primary">清空本卷</button><button id="submit">交卷并统计</button><a href="题号审计.json" target="_blank">查看审计表</a></div><div class="layout"><aside class="panel"><b id="count"></b><div id="grid" class="grid"></div></aside><section class="card"><div id="meta" class="meta"></div><div id="notice" class="notice"></div><div id="stem" class="stem"></div><button id="toggle">显示/隐藏原卷题图</button><div id="source" class="source" hidden></div><div id="choices" class="choices"></div><div class="foot"><button id="prev">← 上一题</button><span id="hint"></span><button id="next" class="primary">下一题 →</button></div></section></div></main><script src="all_questions.js"></script><script>
const names={'1_2023':'2023电网一批（本科）','2_2023':'2023电网一批（硕士）','3_2025':'2025一批电工类真题','4_1':'模拟卷1','5_2':'模拟卷2','6_3':'模拟卷3','7_4':'南网电气类模拟卷4','8_2024':'2024南方电网考前冲刺卷'};const keys=Object.keys(ALL_QUESTIONS),$=x=>document.getElementById(x);let ei=0,qi=0,ans=JSON.parse(localStorage.getItem('all-sgcc-answers-v4')||'{}');for(const k of keys){let o=document.createElement('option');o.value=k;o.textContent=names[k]+'（'+ALL_QUESTIONS[k].length+'题）';$('exam').append(o)}function k(){return keys[ei]}function q(){return ALL_QUESTIONS[k()][qi]}function multi(x){return x.kind==='多选'||/多选/.test((x.type||'')+' '+(x.text||''))}function chosen(x){let v=(ans[k()]||{})[x.id];return Array.isArray(v)?v:(v?[v]:[])}function save(){localStorage.setItem('all-sgcc-answers-v4',JSON.stringify(ans))}function go(n){qi=Math.max(0,Math.min(ALL_QUESTIONS[k()].length-1,n));draw()}function draw(){let key=k(),qs=ALL_QUESTIONS[key],x=q(),m=multi(x),s=chosen(x);$('count').textContent='已作答 '+Object.keys(ans[key]||{}).length+' / '+qs.length;$('grid').innerHTML='';qs.forEach((z,n)=>{let b=document.createElement('button');b.textContent=z.id;b.className=(n===qi?'active ':'')+((ans[key]||{})[z.id]?'done':'');b.onclick=()=>go(n);$('grid').append(b)});$('meta').textContent='第 '+x.id+' 题 · '+(m?'多选':'单选')+' · 每题'+(x.score??(m?1:.5))+'分';$('notice').textContent=m?'多选题：可同时选择多个选项，选完后点击“下一题”。':'';$('stem').textContent=x.text||'（题干文字待核对，请查看原卷题图）';$('source').innerHTML='';(x.images||[]).forEach(p=>{let im=document.createElement('img');im.src=encodeURI(p);$('source').append(im)});$('choices').innerHTML='';(x.options||[]).forEach((v,n)=>{let L=String.fromCharCode(65+n),b=document.createElement('button');b.className=s.includes(L)?'sel':'';b.innerHTML='<span class="letter">'+L+'.</span>'+v;b.onclick=()=>{ans[key()]??={};if(m){let a=chosen(x);ans[key()][x.id]=a.includes(L)?a.filter(y=>y!==L):a.concat(L);save();draw()}else{ans[key()][x.id]=L;save();if(qi<qs.length-1)qi++;draw()}};$('choices').append(b)});$('source').hidden=true;$('prev').disabled=qi===0;$('next').style.display=m?'inline-block':'none';$('next').disabled=qi===qs.length-1;$('next').onclick=()=>go(qi+1);$('hint').textContent=m?'选择完成后点击下一题':qi===qs.length-1?'已到本卷末尾':'选择后自动进入下一题'}$('exam').onchange=e=>{ei=keys.indexOf(e.target.value);qi=0;draw()};$('prev').onclick=()=>go(qi-1);$('reset').onclick=()=>{if(confirm('清空本卷作答记录？')){ans[k()]={};save();draw()}};$('toggle').onclick=()=>{$('source').hidden=!$('source').hidden};$('submit').onclick=()=>{let qs=ALL_QUESTIONS[k()],done=Object.keys(ans[k()]||{}).length;alert('已提交：'+names[k()]+'\n已作答 '+done+' / '+qs.length+' 题。\n多选题已按所选字母保存。')};draw();
</script></body></html>
